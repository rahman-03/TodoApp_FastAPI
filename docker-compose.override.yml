services:
  api:
    build:
      target: development

    env_file:
      - .env

    volumes:
      - .:/app

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
  
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: focussprint

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis: 
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  postgres_data: